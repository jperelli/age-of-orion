[workspace]
resolver = "2"
members = ["crates/lbx", "crates/core", "crates/cli", "crates/wasm", "crates/harness"]

[workspace.package]
version = "0.14.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/jperelli/age-of-orion"
rust-version = "1.85"

[workspace.dependencies]
aoo-lbx = { path = "crates/lbx" }
aoo-core = { path = "crates/core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
png = "0.18.1"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.aoo-wasm]
opt-level = "s"
